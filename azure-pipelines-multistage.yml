# Azure Pipelines Multi-Stage para sipe.backend (Docker + Azure Web App)
trigger:
  branches:
    include:
      - config-docker
      # - main
      # - develop
      # - feature/*

variables:
  ACR_NAME: "sipeacr"
  IMAGE_NAME: "sipe-backend"

stages:
  - stage: Build
    displayName: "Build Docker Image"
    jobs:
      - job: Build
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: DockerInstaller@0
            displayName: "Instalar Docker"
          - task: Docker@2
            displayName: "Login to Azure Container Registry"
            inputs:
              command: login
              containerRegistry: "sipe-frontend" # Usar la service connection existente
          - script: |
              docker build \
                -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) .
            displayName: "Construir imagen Docker"
            workingDirectory: $(Build.SourcesDirectory)
          - script: |
              docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)
            displayName: "Push imagen a ACR"
            workingDirectory: $(Build.SourcesDirectory)

  - stage: Test
    displayName: "Deploy to Testing"
    dependsOn: Build
    variables:
      WEBAPP_NAME: "sipe-backend-development-with-pipeline" # Usa el mismo nombre que en el pipeline simple
      ENVIRONMENT: "testing"
      ACR_NAME: "sipeacr"
      IMAGE_NAME: "sipe-backend-development-with-pipeline"
    jobs:
      - job: TestDeploy
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: DockerInstaller@0
            displayName: "Instalar Docker"
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              command: login
              containerRegistry: "new-sipe-dockerhub"
          - script: |
              docker build \
                --build-arg DB_DATABASE=$(DB_DATABASE) \
                --build-arg DB_DIALECT=$(DB_DIALECT) \
                --build-arg DB_HOST=$(DB_HOST) \
                --build-arg DB_PASSWORD="$(DB_PASSWORD)" \
                --build-arg DB_USERNAME=$(DB_USERNAME) \
                --build-arg ORIGIN_URL=$(ORIGIN_URL) \
                -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) .
            displayName: "Construir imagen Docker"
            workingDirectory: $(Build.SourcesDirectory)
          - script: |
              cd $(Build.SourcesDirectory)
              npm install
              npx sequelize-cli db:migrate
            displayName: "Ejecutar migraciones Sequelize"
            env:
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              DB_DATABASE: $(DB_DATABASE)
              DB_HOST: $(DB_HOST)
              DB_DIALECT: $(DB_DIALECT)
          - task: Docker@2
            displayName: "Login a Azure Container Registry"
            inputs:
              command: login
              containerRegistry: "sipe-frontend" # Usa el nombre de tu Service Connection
          - script: |
              docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)
            displayName: "Push imagen a ACR"
          - task: AzureWebAppContainer@1
            displayName: "Deploy to Azure Web App (Testing)"
            inputs:
              azureSubscription: "new-sipe-rm" # Reemplaza por el nombre de tu conexión de servicio
              appName: "$(WEBAPP_NAME)"
              containers: "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)"
  - stage: Production
    displayName: "Deploy to Production"
    dependsOn: Test
    # condition eliminada para pruebas, el stage Production se ejecutará siempre después de Test
    variables:
      WEBAPP_NAME: "sipe-backend-production-with-pipeline" # Nombre correcto de la Web App de producción
      ENVIRONMENT: "production"
      ACR_NAME: "sipeacr"
      IMAGE_NAME: "sipe-backend-production-with-pipeline"
    jobs:
      - job: BuildAndPushProd
        displayName: "Build and Push Production Image"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: DockerInstaller@0
            displayName: "Instalar Docker"
          - task: Docker@2
            displayName: "Login a Azure Container Registry"
            inputs:
              command: login
              containerRegistry: "sipe-frontend" # Usa el nombre de tu Service Connection
          - script: |
              docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId) .
            displayName: "Construir imagen Docker (Producción)"
            workingDirectory: $(Build.SourcesDirectory)
          - script: |
              docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)
            displayName: "Push imagen a ACR (Producción)"
            workingDirectory: $(Build.SourcesDirectory)
      - deployment: DeployProd
        environment: production
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: "Deploy to Azure Web App (Production)"
                  inputs:
                    azureSubscription: "new-sipe-rm" # Cambia por tu Service Connection
                    appName: "$(WEBAPP_NAME)"
                    containers: "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)"
                    # Puedes agregar variables de entorno aquí si tu Web App las soporta
